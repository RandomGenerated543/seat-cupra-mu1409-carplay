name: Source handoff checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: python3 scripts/audit_publication.py
      - run: python3 scripts/test_host.py
      - run: python3 scripts/verify_receiver.py deployment/receiver-upgrade/payload/libmibr_carplay111.so
