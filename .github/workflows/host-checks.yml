name: MU1447 omonob handoff checks
on:
  push:
    branches: [omonob-mu1447]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact SD packages, privacy boundaries and guide links
        run: python3 omonob-mu1447/tools/verify_publication.py
